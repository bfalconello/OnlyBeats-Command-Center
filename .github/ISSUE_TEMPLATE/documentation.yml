name: Documentation request
description: Report missing, unclear, or inaccurate documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: file
    attributes:
      label: Document or topic
      placeholder: docs/ARCHITECTURE.md
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or missing?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
