name: Windows Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Installer
        run: npm run dist:win

      - name: Verify Installer Exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist")) {
            Write-Error "dist folder not found."
          }

          Get-ChildItem dist -Recurse

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: OnlyBeats-Windows-Installer
          path: |
            dist/**/*.exe
          if-no-files-found: error

      - name: Build Summary
        if: success()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "OnlyBeats Windows Build Complete"
          Write-Host "======================================"
          Get-ChildItem dist -Recurse